<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<!-- The Last Drop: the page around the web build. Phone-ready: no zooming or
		     scrolling, a themed loading screen, a "turn your phone" screen in
		     portrait, a fullscreen button, and the tags that let it be added to a
		     home screen and open like an app. Godot fills in the $GODOT_ values. -->
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta name="description" content="THE LAST DROP: a top-down survival adventure. Restore the water, sort the waste, fight the zombies, bring the regions back to life.">
		<meta name="theme-color" content="#12303a">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Last Drop">
		<meta name="format-detection" content="telephone=no">
		<meta property="og:title" content="The Last Drop">
		<meta property="og:description" content="A top-down survival adventure about bringing the water back. Plays in the browser, on desktop and phone.">
		<meta property="og:type" content="website">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overscroll-behavior: none;
}

body {
	color: #f6ecd6;
	background-color: #0b1418;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}

#canvas {
	display: block;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

/* ---------------------------------------------------------------- loading */

#status {
	position: absolute;
	inset: 0;
	background: radial-gradient(ellipse at 50% 40%, #16343f 0%, #0b1418 70%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.2rem;
	visibility: hidden;
	z-index: 2;
}

#status-splash {
	display: none;
}

#status-title {
	font-size: clamp(1.4rem, 6vmin, 2.6rem);
	letter-spacing: 0.35em;
	color: #8fd3ff;
	text-shadow: 0 0 18px rgba(74, 163, 223, 0.55);
	text-align: center;
	padding-left: 0.35em;
}

#status-drop {
	width: 18px;
	height: 18px;
	background: #4aa3df;
	border-radius: 0 50% 50% 50%;
	transform: rotate(45deg);
	animation: drip 1.4s ease-in infinite;
	box-shadow: 0 0 14px rgba(74, 163, 223, 0.7);
}

@keyframes drip {
	0% { transform: translateY(-14px) rotate(45deg); opacity: 0; }
	30% { opacity: 1; }
	100% { transform: translateY(14px) rotate(45deg); opacity: 0; }
}

#status-progress {
	display: none;
	width: min(60vw, 360px);
	height: 8px;
	appearance: none;
	-webkit-appearance: none;
	border: 1px solid #2f5a68;
	border-radius: 4px;
	background: #0e1d23;
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background: #0e1d23;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #2f86c0, #8fd3ff);
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #2f86c0, #8fd3ff);
}

#status-hint {
	font-size: 0.8rem;
	color: #7f98a3;
	text-align: center;
	max-width: 80vw;
	line-height: 1.5;
}

#status-notice {
	display: none;
	background-color: #3b2228;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.4;
	margin: 0 2rem;
	padding: 1rem;
	text-align: center;
	max-width: 32rem;
}

/* ---------------------------------------------------------------- phones */

#rotate {
	position: fixed;
	inset: 0;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 1.4rem;
	background: #0b1418;
	color: #f6ecd6;
	z-index: 10;
	text-align: center;
	padding: 2rem;
	font-size: 1rem;
	line-height: 1.5;
}

#rotate-phone {
	width: 44px;
	height: 76px;
	border: 3px solid #8fd3ff;
	border-radius: 8px;
	animation: turn 2.2s ease-in-out infinite;
}

@keyframes turn {
	0%, 25% { transform: rotate(0deg); }
	60%, 100% { transform: rotate(-90deg); }
}

@media (orientation: portrait) and (pointer: coarse) {
	#rotate {
		display: flex;
	}
}

#fullscreen {
	position: fixed;
	left: max(8px, env(safe-area-inset-left));
	top: max(8px, env(safe-area-inset-top));
	width: 34px;
	height: 34px;
	display: none;
	border: 1px solid rgba(143, 211, 255, 0.5);
	border-radius: 8px;
	background: rgba(11, 20, 24, 0.55);
	color: #8fd3ff;
	font-size: 18px;
	line-height: 30px;
	text-align: center;
	z-index: 5;
	padding: 0;
}

body.can-fullscreen:not(.is-fullscreen) #fullscreen {
	display: block;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			The Last Drop needs JavaScript to run.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<div id="status-title">THE LAST DROP</div>
			<div id="status-drop"></div>
			<progress id="status-progress"></progress>
			<div id="status-hint">Loading the wasteland&hellip;</div>
			<div id="status-notice"></div>
		</div>

		<div id="rotate" aria-live="polite">
			<div id="rotate-phone"></div>
			<div>Turn your phone sideways to play.</div>
		</div>

		<button id="fullscreen" type="button" aria-label="Fullscreen">&#x26F6;</button>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Phones and tablets: no long-press menus, no pinch or double-tap zoom, and a
// way into fullscreen (it must come from a tap). Android also locks landscape
// once in fullscreen; iPhones get there through "Add to Home Screen".
(function () {
	const coarse = window.matchMedia('(pointer: coarse)').matches;
	const root = document.documentElement;
	const canFullscreen = Boolean(root.requestFullscreen || root.webkitRequestFullscreen);
	const standalone = window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || window.navigator.standalone === true;
	const button = document.getElementById('fullscreen');
	let askedOnce = false;

	function isFullscreen() {
		return Boolean(document.fullscreenElement || document.webkitFullscreenElement) || standalone;
	}

	function syncClasses() {
		document.body.classList.toggle('can-fullscreen', coarse && canFullscreen && !standalone);
		document.body.classList.toggle('is-fullscreen', isFullscreen());
	}

	function enterFullscreen() {
		if (isFullscreen() || !canFullscreen) {
			return;
		}
		const request = root.requestFullscreen ? root.requestFullscreen({ navigationUI: 'hide' }) : root.webkitRequestFullscreen();
		Promise.resolve(request).then(() => {
			if (screen.orientation && screen.orientation.lock) {
				return screen.orientation.lock('landscape').catch(() => {});
			}
			return null;
		}).catch(() => {}).finally(syncClasses);
	}

	document.addEventListener('contextmenu', (event) => event.preventDefault());
	document.addEventListener('gesturestart', (event) => event.preventDefault());
	document.addEventListener('dblclick', (event) => event.preventDefault());
	document.addEventListener('fullscreenchange', syncClasses);
	document.addEventListener('webkitfullscreenchange', syncClasses);
	button.addEventListener('click', (event) => {
		event.stopPropagation();
		enterFullscreen();
	});
	// The first tap on a phone goes fullscreen; after that, only the button does.
	window.addEventListener('touchend', () => {
		if (coarse && !askedOnce) {
			askedOnce = true;
			enterFullscreen();
		}
	}, { passive: true });
	syncClasses();
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusHint = document.getElementById('status-hint');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		statusHint.textContent = 'Try reloading the page, or a recent Chrome, Firefox, Edge or Safari.';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusHint.textContent = 'Loading the wasteland… ' + Math.round((100 * current) / total) + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
